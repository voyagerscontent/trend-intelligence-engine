name: audit
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static architecture audit (invariants)
        run: python scripts/audit_static.py
      - name: Unit tests
        run: pytest -q
      - name: End-to-end dry run (no credentials)
        run: python -m trendengine.pipeline --stage all --dry-run
