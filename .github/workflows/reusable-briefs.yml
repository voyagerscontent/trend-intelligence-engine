name: reusable-briefs

# Interop surface: lets OTHER repos in the org drive this engine.
#
# 1. workflow_call   — a sibling repo's workflow can `uses:` this job.
# 2. repository_dispatch — an external service (or another repo's PAT)
#                          can POST an event to kick off a run on demand.
#
# All credentials stay in THIS repo's Actions secrets and are referenced
# via ${{ secrets.* }} — nothing sensitive is committed. A calling repo
# never sees the keys; it only triggers the run.

on:
  workflow_call:
    inputs:
      stage:
        description: "Pipeline stage: ingest | briefs | all"
        type: string
        default: "briefs"
      dry_run:
        description: "Run without calling delivery APIs"
        type: boolean
        default: false
  repository_dispatch:
    types: [run-briefs]

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run pipeline
        run: >
          python -m trendengine.pipeline
          --stage ${{ inputs.stage || github.event.client_payload.stage || 'briefs' }}
          ${{ (inputs.dry_run || github.event.client_payload.dry_run) && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
