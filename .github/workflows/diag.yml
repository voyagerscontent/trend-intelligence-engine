name: diag
on:
  push:
    paths:
      - '.github/DIAG'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          rm -f run-output.log
          pip install -e . 2>&1 | tail -n 3 | tee -a run-output.log
      - name: Run pipeline (capture, non-fatal)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID || vars.AIRTABLE_BASE_ID || 'appSeOYXfUUEPDZwz' }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL || vars.SLACK_CHANNEL || 'C0BNMT8EQ67' }}
          SEC_BASE: ${{ secrets.AIRTABLE_BASE_ID != '' }}
          VAR_BASE: ${{ vars.AIRTABLE_BASE_ID != '' }}
          SEC_CHAN: ${{ secrets.SLACK_CHANNEL != '' }}
          VAR_CHAN: ${{ vars.SLACK_CHANNEL != '' }}
        run: |
          echo "AIRTABLE_BASE_ID -> secret:$SEC_BASE  variable:$VAR_BASE" | tee -a run-output.log
          echo "SLACK_CHANNEL    -> secret:$SEC_CHAN  variable:$VAR_CHAN" | tee -a run-output.log
          echo "resolved AIRTABLE_BASE_ID: $([ -n "$AIRTABLE_BASE_ID" ] && echo set || echo MISSING)" | tee -a run-output.log
          echo "resolved SLACK_CHANNEL:    $([ -n "$SLACK_CHANNEL" ] && echo set || echo MISSING)" | tee -a run-output.log
          echo "== pipeline start ==" | tee -a run-output.log
          python -m trendengine.pipeline --stage briefs 2>&1 | grep -vE '^\[(airtable|slack) dry-run\]|would (upsert|post)|penguin chick|GEO target|Hero asset|Format:|keyword:|Brief|Audience|Angle|Property|Why now|Channel|Production|Visuals|Distribution|Blog|YouTube|Reels|IG |Email|PR ' | tee -a run-output.log
          echo "PIPELINE_EXIT=${PIPESTATUS[0]}" | tee -a run-output.log
      - name: Commit log back
        run: |
          git config user.name "diag-bot"
          git config user.email "diag@local"
          git add -f run-output.log
          git commit -m "diag: run output [skip ci]" || echo "nothing to commit"
          git push
