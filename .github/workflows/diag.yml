name: diag

# Diagnostic: run the pipeline, capture ALL output, commit it back as
# run-output.log so it can be read without the Actions API. Trigger by
# pushing a change to .github/DIAG.

on:
  push:
    paths:
      - '.github/DIAG'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . 2>&1 | tee -a run-output.log
      - name: Run pipeline (capture, non-fatal)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          echo "== which secrets are present (names only) ==" | tee -a run-output.log
          for v in ANTHROPIC_API_KEY AIRTABLE_TOKEN AIRTABLE_BASE_ID SLACK_TOKEN SLACK_CHANNEL; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: MISSING"; fi
          done | tee -a run-output.log
          echo "== pipeline start ==" | tee -a run-output.log
          python -m trendengine.pipeline --stage briefs 2>&1 | tee -a run-output.log
          echo "PIPELINE_EXIT=${PIPESTATUS[0]}" | tee -a run-output.log
      - name: Commit log back
        run: |
          git config user.name "diag-bot"
          git config user.email "diag@local"
          git add -f run-output.log
          git commit -m "diag: run output [skip ci]" || echo "nothing to commit"
          git push
