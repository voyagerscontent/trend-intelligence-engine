name: manual-run

# API-free manual trigger. Editing .github/RUN_NOW and pushing runs the
# pipeline immediately, without needing the Actions REST API. Calls the
# reusable workflow so all secrets come from this repo (secrets: inherit).

on:
  push:
    paths:
      - '.github/RUN_NOW'
  workflow_dispatch: {}

jobs:
  run:
    uses: ./.github/workflows/reusable-briefs.yml
    with:
      stage: briefs
      dry_run: false
    secrets: inherit
